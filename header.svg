<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#E05580" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0s" fill="freeze"/>

    <g filter="url(#shadow)">
      <rect x="40" y="24" width="720" height="152" rx="20" ry="20" fill="#FFECF3"/>
      <rect x="40" y="24" width="720" height="42" rx="20" ry="20" fill="#FF6F9C"/>
      <rect x="40" y="46"  width="720" height="20"  fill="#FF6F9C"/>
    </g>

    <rect x="40" y="24" width="720" height="152" rx="20" ry="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>

    <text x="68" y="51" font-family="'Courier New', monospace" font-size="12" letter-spacing="2.5" font-weight="bold" fill="#FFFFFF" opacity="0.95">github.com/AgusCabral</text>

    <g transform="translate(726,34)">
      <rect width="26" height="26" rx="8" fill="#FFFFFF" opacity="0.22"/>
      <line x1="7" y1="7" x2="19" y2="19" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="19" y1="7" x2="7" y2="19" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <text x="400" y="118" text-anchor="middle"
      font-family="'Trebuchet MS', Verdana, sans-serif"
      font-size="38" font-weight="bold" letter-spacing="3"
      fill="#FF6F9C">AGUSTINA CABRAL</text>

    <text x="400" y="150" text-anchor="middle"
      font-family="'Trebuchet MS', Verdana, sans-serif"
      font-size="16" letter-spacing="4"
      fill="#FFB6C9">QA SSR</text>
  </g>
</svg>
